services:
  redis:
    image: 'redis:alpine'
    restart: unless-stopped
    command:
      - sh
      - '-c'
      - 'redis-server --requirepass ${REDIS_PASSWORD:-evoai_redis_pass} --appendonly yes'
    volumes:
      - 'redis_data:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-evoai_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped

  rabbitmq:
    image: 'rabbitmq:3-alpine'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  evo-auth:
    build:
      context: ./evo-auth-service-community
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: '${RAILS_ENV:-production}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-evoai_redis_pass}@redis:6379/1'
      POSTGRES_HOST: '${POSTGRES_HOST}'
      POSTGRES_PORT: '${POSTGRES_PORT}'
      RUN_MIGRATIONS: 'false'
    depends_on:
      redis:
        condition: service_healthy
    command: 'bash -c "rm -f /rails/tmp/pids/server.pid && bundle exec rails s -p 3001 -b 0.0.0.0"'
    # healthcheck:
    #   test: ["CMD", "ruby", "-e", "Net::HTTP.get(URI('http://localhost:3001/health'))"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 90s
      # test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      # interval: 30s
      # timeout: 10s
      # retries: 5
      # start_period: 90s

  evo-auth-sidekiq:
    build:
      context: ./evo-auth-service-community
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: '${RAILS_ENV:-development}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-evoai_redis_pass}@redis:6379/1'
      POSTGRES_HOST: '${POSTGRES_HOST}'
      POSTGRES_PORT: '${POSTGRES_PORT}'
      RUN_MIGRATIONS: 'false'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    command: 'bundle exec sidekiq'

  evo-crm:
    build:
      context: ./evo-ai-crm-community
      dockerfile: docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        RAILS_ENV: '${RAILS_ENV:-production}'
        RAILS_SERVE_STATIC_FILES: '${RAILS_SERVE_STATIC_FILES:-true}'
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: '${RAILS_ENV:-development}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-evoai_redis_pass}@redis:6379/0'
      POSTGRES_HOST: '${POSTGRES_HOST}'
      POSTGRES_PORT: '${POSTGRES_PORT}'
      EVO_AUTH_SERVICE_URL: 'http://evo-auth:3001'
      EVO_AI_CORE_SERVICE_URL: 'http://evo-core:5555'
      EVO_AI_ENCRYPTION_KEY: '${ENCRYPTION_KEY}'
      BOT_RUNTIME_URL: 'http://evo-bot-runtime:8080'
      BOT_RUNTIME_SECRET: '${BOT_RUNTIME_SECRET}'
      BOT_RUNTIME_POSTBACK_BASE_URL: 'http://evo-crm:3000'
    depends_on:
      redis:
        condition: service_healthy
      evo-auth:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  evo-crm-sidekiq:
    build:
      context: ./evo-ai-crm-community
      dockerfile: docker/Dockerfile
      args:
        BUNDLE_WITHOUT: ''
        RAILS_ENV: development
        RAILS_SERVE_STATIC_FILES: 'false'
    restart: unless-stopped
    env_file: .env
    environment:
      RAILS_ENV: '${RAILS_ENV:-development}'
      REDIS_URL: 'redis://:${REDIS_PASSWORD:-evoai_redis_pass}@redis:6379/0'
      POSTGRES_HOST: '${POSTGRES_HOST}'
      POSTGRES_PORT: '${POSTGRES_PORT}'
      EVO_AUTH_SERVICE_URL: 'http://evo-auth:3001'
      EVO_AI_CORE_SERVICE_URL: 'http://evo-core:5555'
      EVO_AI_ENCRYPTION_KEY: '${ENCRYPTION_KEY}'
      BOT_RUNTIME_URL: 'http://evo-bot-runtime:8080'
      BOT_RUNTIME_SECRET: '${BOT_RUNTIME_SECRET}'
      BOT_RUNTIME_POSTBACK_BASE_URL: 'http://evo-crm:3000'
      RUN_MIGRATIONS: 'false'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  evo-core:
    image: 'evoapicloud/evo-ai-core-service-community:latest'
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: '${POSTGRES_HOST}'
      DB_PORT: '${POSTGRES_PORT}'
      DB_USER: '${POSTGRES_USERNAME}'
      DB_PASSWORD: '${POSTGRES_PASSWORD}'
      DB_NAME: '${POSTGRES_DATABASE}'
      DB_SSLMODE: disable
      PORT: '5555'
      EVOLUTION_BASE_URL: 'http://evo-crm:3000'
      EVO_AUTH_BASE_URL: 'http://evo-auth:3001'
      AI_PROCESSOR_URL: 'http://evo-processor:8000'
      AI_PROCESSOR_VERSION: '${AI_PROCESSOR_VERSION:-v1}'
      JWT_SECRET_KEY: '${JWT_SECRET_KEY}'
      JWT_ALGORITHM: '${JWT_ALGORITHM:-HS256}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5555/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  evo-processor:
    build:
      context: ./evo-ai-processor-community
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_CONNECTION_STRING: 'postgresql://${POSTGRES_USERNAME}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DATABASE}'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      REDIS_SSL: 'false'
      HOST: 0.0.0.0
      PORT: '8000'
      EVO_AI_CRM_URL: 'http://evo-crm:3000'
      CORE_SERVICE_URL: 'http://evo-core:5555/api/v1'
      EVO_AUTH_BASE_URL: 'http://evo-auth:3001'
    volumes:
      - 'processor_logs:/app/logs'
    depends_on:
      redis:
        condition: service_healthy
      evo-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  evo-bot-runtime:
    build:
      context: ./evo-bot-runtime
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_ADDR: '0.0.0.0:8080'
      REDIS_URL: 'redis://:${REDIS_PASSWORD}@redis:6379'
      AI_PROCESSOR_URL: 'http://evo-processor:8000'
      BOT_RUNTIME_SECRET: '${BOT_RUNTIME_SECRET}'
      MEDIA_HOST_ALLOWLIST: '${MEDIA_HOST_ALLOWLIST}'
    depends_on:
      redis:
        condition: service_healthy
      evo-processor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  clickhouse:
    image: 'clickhouse/clickhouse-server:latest'
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_DB: default
    volumes:
      - 'clickhouse_data:/var/lib/clickhouse'
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "default", "--password", "password", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  evo-flow:
    build:
      context: ./evo-flow-community
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - sh
      - '-c'
      - "node -e 'const{Client}=require(\"pg\");const db=process.env.POSTGRES_DB_DATABASE;const c=new Client({host:process.env.POSTGRES_DB_HOST,port:+(process.env.POSTGRES_DB_PORT),user:process.env.POSTGRES_DB_USERNAME,password:process.env.POSTGRES_DB_PASSWORD,database:\"postgres\"});c.connect().then(()=>c.query(\"CREATE DATABASE \"+db)).then(()=>console.log(\"[init] created \"+db)).catch(e=>console.log(\"[init] \"+(e.code===\"42P04\"?\"db already exists\":e.message))).finally(()=>c.end());'\nnode_modules/.bin/typeorm migration:run -d dist/database/ormconfig.js || echo \"[init] migration:run failed (continuing)\"\nexec node dist/main.js\n"
    environment:
      NODE_ENV: development
      RUN_MODE: api
      QUEUE_MODE: direct
      STORAGE_MODE: clickhouse
      WRITE_MODE: ch-sync
      PORT: '3334'
      BROKER_TYPE: rabbitmq
      RABBITMQ_URL: 'amqp://rabbitmq:5672'
      AUTH_APIKEY_INTEGRATION_LOCAL: '${AUTH_APIKEY_INTEGRATION_LOCAL}'
      EVO_AUTH_SERVICE_URL: 'http://evo-auth:3001'
      EVO_AUTH_VALIDATE_TOKEN_ENDPOINT: /api/v1/auth/validate
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: '8123'
      CLICKHOUSE_DATABASE: evo_campaign
      CLICKHOUSE_USERNAME: default
      CLICKHOUSE_PASSWORD: password
      CLICKHOUSE_TABLE: contact_events
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
      REDIS_DB: '4'
      POSTGRES_DB_HOST: '${POSTGRES_HOST}'
      POSTGRES_DB_PORT: '${POSTGRES_PORT}'
      POSTGRES_DB_USERNAME: '${POSTGRES_USERNAME}'
      POSTGRES_DB_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB_DATABASE: evo_campaign
      EVOAI_CRM_BASE_URL: 'http://evo-crm:3000'
      EVOAI_CRM_API_TOKEN: '${EVOAI_CRM_API_TOKEN}'
      LOG_LEVEL: log
    depends_on:
      clickhouse:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  evo-frontend:
    build:
      context: ./evo-ai-frontend-community
      dockerfile: Dockerfile
      args:
        VITE_API_URL: '${VITE_API_URL}'
        VITE_AUTH_API_URL: '${VITE_AUTH_API_URL}'
        VITE_WS_URL: '${VITE_WS_URL}'
        VITE_EVOAI_API_URL: '${VITE_EVOAI_API_URL}'
        VITE_AGENT_PROCESSOR_URL: '${VITE_AGENT_PROCESSOR_URL}'
        VITE_EVOFLOW_API_URL: '${VITE_EVOFLOW_API_URL}'
    restart: unless-stopped
    env_file: .env
    environment:
      VITE_API_URL: '${VITE_API_URL}'
      VITE_AUTH_API_URL: '${VITE_AUTH_API_URL}'
      VITE_WS_URL: '${VITE_WS_URL}'
      VITE_EVOAI_API_URL: '${VITE_EVOAI_API_URL}'
      VITE_AGENT_PROCESSOR_URL: '${VITE_AGENT_PROCESSOR_URL}'
      VITE_EVOFLOW_API_URL: '${VITE_EVOFLOW_API_URL}'
    depends_on:
      evo-auth:
        condition: service_healthy
      evo-crm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  redis_data: null
  processor_logs: null
  clickhouse_data: null